name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  examples:
    name: examples (${{ matrix.example }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        example: [grammy_commands, aiogram_commands]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: astral-sh/setup-uv@v7
      - name: Reference suite
        shell: bash
        env:
          EXAMPLE: ${{ matrix.example }}
        run: |
          set -euo pipefail
          case "$EXAMPLE" in
            grammy_commands)
              cd examples/grammy_commands
              bun install --frozen-lockfile
              bun run typecheck
              bun test
              ;;
            aiogram_commands)
              cd examples/aiogram_commands
              uv sync --frozen
              uv run pytest -q
              ;;
            *)
              echo "::error title=unknown example::no suite defined for $EXAMPLE"
              exit 1
              ;;
          esac
      - name: Verify reference project
        shell: bash
        env:
          EXAMPLE: ${{ matrix.example }}
        run: |
          set -euo pipefail
          node dist/cli.js verify "examples/$EXAMPLE" --json > "$RUNNER_TEMP/verify.json"
          node -e '
            const result = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            const summary = result.value?.summary ?? { fail: -1 };
            if (result.status !== "ok" || result.value.ok !== true || summary.fail !== 0) {
              console.error("verify gate failed: " + JSON.stringify(summary));
              process.exit(1);
            }
            console.log("verify ok: " + summary.fail + " fail");
          ' "$RUNNER_TEMP/verify.json"

  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:fuzz

  workflows:
    name: workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

  package:
    name: package smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Pack and install the tarball
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pkg" "$RUNNER_TEMP/app"
          pnpm pack --pack-destination "$RUNNER_TEMP/pkg"
          cd "$RUNNER_TEMP/app"
          npm init -y >/dev/null
          npm install "$RUNNER_TEMP"/pkg/*.tgz
          npx --no-install aurifex target --stack grammy --json \
            | grep -q '"frameworkVersion":"1.46.0"'
          npx --no-install aurifex --help > "$RUNNER_TEMP/help.txt"
          for command in target inspect verify install; do
            grep -Eq "^  aurifex ${command}( |$)" "$RUNNER_TEMP/help.txt"
          done
          if grep -Eq "^  aurifex (new|add|deploy|harness|upgrade)( |$)" "$RUNNER_TEMP/help.txt"; then
            echo "::error title=CLI surface::--help still advertises a removed command"
            exit 1
          fi
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2026-07-28","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | node node_modules/aurifex/dist/adapters/mcp/server.js > "$RUNNER_TEMP/tools.json"
          node -e '
            const fs = require("node:fs");
            const messages = fs.readFileSync(process.argv[1], "utf8").trim().split("\n").map((line) => JSON.parse(line));
            const list = messages.find((message) => message.id === 2);
            const names = list.result.tools.map((tool) => tool.name).sort().join(",");
            if (names !== "telegram_bot_inspect,telegram_bot_target_resolve,telegram_bot_verify") {
              console.error("tools/list exposed: " + names);
              process.exit(1);
            }
          ' "$RUNNER_TEMP/tools.json"
      - uses: actions/upload-artifact@v7
        with:
          name: aurifex-package
          path: ${{ runner.temp }}/pkg/*.tgz
          if-no-files-found: error

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: node tools/check-no-secrets.mjs
