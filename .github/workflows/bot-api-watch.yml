name: Bot API watch

on:
  schedule:
    - cron: "31 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: bot-api-watch
  cancel-in-progress: false

jobs:
  check:
    name: check pinned Bot API contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Compare live docs with src/core/targets/bot-api-contract.json
        id: check
        shell: bash
        run: |
          set +e
          node scripts/check-bot-api.mjs --check > "$RUNNER_TEMP/bot-api.log" 2>&1
          code=$?
          cat "$RUNNER_TEMP/bot-api.log"
          exit $code
      - name: Open or update the drift issue
        if: failure() && steps.check.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node scripts/check-bot-api.mjs --version 2>/dev/null || true)"
          version="${version:-unknown}"
          title="Bot API drift: ${version}"
          {
            echo "The pinned contract in \`src/core/targets/bot-api-contract.json\` no longer matches the official Bot API docs."
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo '```'
            cat "$RUNNER_TEMP/bot-api.log" 2>/dev/null || echo "check log unavailable"
            echo '```'
          } > "$RUNNER_TEMP/body.md"
          number="$(gh issue list --state open --search "in:title \"Bot API drift\"" --limit 100 --json number,title --jq ".[] | select(.title == \"${title}\") | .number" | head -n 1)"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$RUNNER_TEMP/body.md"
          else
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi
