name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release
        required: true

permissions:
  contents: read

jobs:
  verify:
    name: verify release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v6
        with:
          version: 12.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm build
      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/pkg"
          pnpm pack --pack-destination "$RUNNER_TEMP/pkg"
          cd "$RUNNER_TEMP/pkg"
          sha256sum ./*.tgz > SHA256SUMS
      - name: SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ${{ runner.temp }}/pkg
          format: cyclonedx-json
          output-file: ${{ runner.temp }}/pkg/aurifex.sbom.json
          upload-artifact: false
      - uses: sigstore/cosign-installer@v4.1.3
      - name: Sign release artifacts
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          for file in "$RUNNER_TEMP"/pkg/*.tgz; do
            cosign sign-blob --yes "$file" \
              --output-signature "${file}.sig" \
              --output-certificate "${file}.pem"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: release-package
          path: ${{ runner.temp }}/pkg/*
          if-no-files-found: error

  github-release:
    name: GitHub release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-package
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --generate-notes \
              --verify-tag
          fi

  npm:
    name: npm publish
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v6
        with:
          version: 12.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@v8
        with:
          name: release-package
          path: dist
      - name: Publish when NPM_TOKEN is configured
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN is not configured; skipping npm publish."
            exit 0
          fi
          npm publish dist/*.tgz --access public --provenance
  examples:
    name: GHCR examples
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        example: [grammy_commands, aiogram_commands, grammy_payments]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: examples/${{ matrix.example }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/lukavtz/aurifex-example-${{ matrix.example }}:${{ github.ref_name }}
