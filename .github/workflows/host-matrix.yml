name: host-matrix

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosts:
    name: host matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        host: [omp, dsh, claude]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # omp 18.18.3 needs Bun >= 1.4.4; the repo's own dev pin is 1.4.2.
      - uses: oven-sh/setup-bun@v2
        if: matrix.host == 'omp'
        with:
          bun-version: "1.4.4"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/pkg"
          pnpm pack --pack-destination "$RUNNER_TEMP/pkg"
      - name: OMP
        if: matrix.host == 'omp'
        env:
          # The upload step reads this exact path; without it the smoke script
          # falls back to an unpredictable mkdtemp directory.
          AURIFEX_ARTIFACT_DIR: ${{ runner.temp }}/aurifex-artifacts
        run: |
          npm install --global @oh-my-pi/pi-coding-agent@18.18.3
          node --experimental-strip-types tools/smoke-hosts.ts --host omp --package "$RUNNER_TEMP"/pkg/*.tgz
      - name: DeepSeek Harness
        if: matrix.host == 'dsh'
        env:
          # The upload step reads this exact path; without it the smoke script
          # falls back to an unpredictable mkdtemp directory.
          AURIFEX_ARTIFACT_DIR: ${{ runner.temp }}/aurifex-artifacts
        run: |
          npm install --global @deepseek-ai/dsh@0.2.2-rc.1
          node --experimental-strip-types tools/smoke-hosts.ts --host dsh --package "$RUNNER_TEMP"/pkg/*.tgz
      - name: Claude Code
        if: matrix.host == 'claude'
        env:
          # The upload step reads this exact path; without it the smoke script
          # falls back to an unpredictable mkdtemp directory.
          AURIFEX_ARTIFACT_DIR: ${{ runner.temp }}/aurifex-artifacts
        run: |
          npm install --global @anthropic-ai/claude-code@2.1.308
          node --experimental-strip-types tools/smoke-hosts.ts --host claude --package "$RUNNER_TEMP"/pkg/*.tgz
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: host-${{ matrix.host }}
          path: ${{ runner.temp }}/aurifex-artifacts/
          if-no-files-found: error
