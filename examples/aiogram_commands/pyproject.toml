[project]
name = "aiogram_commands-bot"
version = "0.1.0"
description = "Aiogram Commands Telegram bot"
requires-python = ">=3.11,<3.15"
dependencies = [
  "aiogram==3.31.0",
  "pydantic-settings==2.16.2",
  "asyncpg==0.32.0",
  "sqlalchemy[asyncio]==2.1.8",
  "redis==8.1.0",
  "alembic==1.20.1",
  "httpx==0.28.1",
  "structlog==26.1.0",
  "opentelemetry-sdk==1.45.2",
  "opentelemetry-exporter-otlp-proto-http==1.45.2",
  "opentelemetry-instrumentation-aiohttp-server==0.66b2",
  "opentelemetry-instrumentation-sqlalchemy==0.66b2",
  "opentelemetry-instrumentation-redis==0.66b2",
  "prometheus-client==0.26.0",
  "sentry-sdk==2.74.0",
]

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "pytest-asyncio==1.4.1.post1",
  "ruff==0.17.4",
  "mypy==2.4.1",
  "aiohttp==3.14.4",
  "hypothesis==6.170.15",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = false
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
